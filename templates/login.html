<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harmony Vintage — Secure Access</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .brand-font { font-family: 'Playfair Display', serif; }
    </style>
</head>
<body class="bg-[#0b0f19] text-slate-100 min-h-screen flex items-center justify-center selection:bg-emerald-500 selection:text-black">

    <div class="w-full max-w-md p-8 bg-[#0f1424] border border-slate-800 rounded-2xl shadow-2xl relative overflow-hidden">
        <div class="absolute -top-20 -right-20 w-40 h-40 bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>
        
        <div class="text-center mb-8 relative z-10">
            <h1 class="brand-font text-3xl font-semibold tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-amber-200 via-slate-100 to-amber-200">
                Harmony Vintage
            </h1>
            <p class="text-xs text-slate-400 mt-2 uppercase tracking-widest font-medium">Autonomous Sourcing Engine</p>
        </div>

        {% if error %}
        <div class="mb-6 p-3 bg-red-950/50 border border-red-900/50 rounded-lg text-xs text-red-400 text-center font-medium">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/login" class="space-y-6 relative z-10">
            <div class="space-y-2">
                <label class="text-xs font-medium text-slate-400 uppercase tracking-wider block">Master Admin Vault Key</label>
                <input type="password" name="password" required autofocus
                    class="w-full bg-[#0b0f19] border border-slate-700 rounded-lg px-4 py-3 text-sm text-white focus:outline-none focus:border-amber-400 focus:ring-1 focus:ring-amber-400 transition" 
                    placeholder="••••••••••••">
            </div>

            <button type="submit" class="w-full py-3 bg-gradient-to-r from-amber-400 to-amber-500 hover:from-amber-500 hover:to-amber-600 text-slate-950 rounded-xl font-semibold text-sm tracking-wide shadow-lg hover:shadow-amber-500/10 active:scale-[0.99] transition duration-150">
                Authenticate Session
            </button>
        </form>
        
        <div class="mt-8 text-center border-t border-slate-800/80 pt-6">
            <p class="text-[10px] text-slate-600">Encrypted via AES-256 & Session Tokens. Restricted Access Only.</p>
        </div>
    </div>

</body>
</html>
